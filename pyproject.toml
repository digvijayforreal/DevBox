[project]
name = "devbox"
version = "0.1.0"
description = "Multi-agent LangChain + Groq assistant for your Windows PC, with handoffs and human approval"
readme = "README.md"
authors = [
    { name = "Digvijay", email = "digvijayforreal@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "langchain>=1.5.0",
    "langchain-groq>=1.2.0",
    "langgraph>=1.2.22",
    "pip-audit>=2.10.1",
    "psutil>=7.2.2",
    "python-dotenv>=1.2.4",
    "send2trash>=2.2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
devbox = "devbox:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
